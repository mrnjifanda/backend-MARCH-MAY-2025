{% extends "base.html" %}
{% block content %}
    <h2>Edit Article</h2>
    <form method="post"
        action="{{ url_for('admin.edit', id=article.id) }}"
    >
        <input value="{{ article.title }}" type="text" name="title" placeholder="Title" required>
        <textarea name="content" placeholder="Content" required>
            {{ article.content }}
        </textarea>
        <button type="submit">Edit Article</button>
    </form>
{% endblock %}
